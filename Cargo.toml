[workspace]
resolver = "3"
members = [
    "crates/sb-proto",
    "crates/sb-enclave",
    "crates/sb-host",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100.0"
authors = ["Anthony Vespoli"]
publish = false

[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
base64 = "0.22"
crypto_box = { version = "0.9", features = ["seal", "std"] }
hex = "0.4"
hmac = "0.12"
libc = "0.2"
libloading = "0.8"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snow = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
uuid = { version = "1.11", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
